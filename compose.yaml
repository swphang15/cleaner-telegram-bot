services:
  init-storage:
    build: .
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/images
        chown -R --no-dereference 10001:10001 /data
        chmod -R u+rwX /data
        chgrp 10001 /run/secrets/telegram_token
        chmod g+r,o-rwx /run/secrets/telegram_token
        echo "Storage permissions initialized."
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ./token.txt
        target: /run/secrets/telegram_token
        bind:
          create_host_path: false
  bot:
    build: .
    depends_on:
      init-storage:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Kuala_Lumpur
      BOT_DATA_DIR: /data
      BOT_TOKEN_FILE: /run/secrets/telegram_token
    volumes:
      - type: bind
        source: ./bot.py
        target: /app/bot.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ./token.txt
        target: /run/secrets/telegram_token
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
